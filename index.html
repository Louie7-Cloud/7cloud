<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            display: flex;
            width: 700px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .left {
            background-color: #0f3d2e;
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .left img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
            object-fit: cover;
        }

        .right {
            background-color: #ffffff;
            width: 60%;
            padding: 20px;
        }

        .right h2 {
            color: #0f3d2e;
            margin-bottom: 15px;
        }

        .info {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
            color: #000;
        }

        .value {
            color: #333;
            margin-left: 5px;
        }

        .divider {
            height: 1px;
            background-color: #ccc;
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="left">
        <img src="louie.jpeg" alt="Profile Picture">
    </div>

    <div class="right">
        <h2>Mark Louie O. Casing</h2>

        <div class="info">
            <span class="label">Age:</span>
            <span class="value">20</span>
        </div>
        <div class="divider"></div>

        <div class="info">
            <span class="label">Gender:</span>
            <span class="value">Male</span>
        </div>
        <div class="divider"></div>

        <div class="info">
            <span class="label">Status:</span>
            <span class="value">Single</span>
        </div>
        <div class="divider"></div>

        <div class="info">
            <span class="label">Address:</span>
            <span class="value">Tampilisan, Labrador, Buug, Zamboanga Sibugay</span>
        </div>
        <div class="divider"></div>

        <div class="info">
            <span class="label">Email:</span>
            <span class="value">casingmarklouie7@gmail.com</span>
        </div>
    </div>
</div>

</body>
</html>
